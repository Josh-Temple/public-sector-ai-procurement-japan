name: Deploy public comparison UI to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify main update came through merged pull requests
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const verify = require('./scripts/verify_main_update.cjs');
            await verify({ github, context, core });
      - name: Validate repository structure
        run: python3 scripts/validate_repository.py
      - name: Rebuild evidence projections
        run: |
          python3 scripts/build_evidence_coverage.py
          python3 scripts/build_case_evidence_summary.py
      - name: Verify generated projections are current
        run: |
          git diff --exit-code -- \
            data/evidence_coverage.csv \
            docs/EVIDENCE_COVERAGE.md \
            data/case_evidence_summary.csv \
            docs/CASE_EVIDENCE_SUMMARY.md
      - name: Validate public site
        run: python3 scripts/validate_public_site.py
      - name: Check public JavaScript syntax
        run: node --check assets/app.js
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp insights.html _site/insights.html
          cp case-study.html _site/case-study.html
          cp checklist.html _site/checklist.html
          cp methodology.html _site/methodology.html
          cp robots.txt _site/robots.txt
          cp sitemap.xml _site/sitemap.xml
          cp -r assets _site/assets
          cp -r data _site/data
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
