name: Preserve pending source snapshots

on:
  push:
    branches: [main]
    paths:
      - "data/source_documents.csv"
      - "scripts/source_snapshot.py"
      - ".github/workflows/source-preservation.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: source-preservation
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify main update came through merged pull requests
        uses: actions/github-script@v7
        with:
          script: |
            const verify = require('./scripts/verify_main_update.cjs');
            await verify({ github, context, core });

      - name: Prepare eligible snapshots
        id: prepare
        run: |
          rm -rf _source_snapshots
          mkdir -p _source_snapshots
          python3 scripts/source_snapshot.py prepare \
            --out-dir _source_snapshots \
            --manifest _source_snapshot_manifest.json
          count="$(python3 -c 'import json; print(len(json.load(open("_source_snapshot_manifest.json", encoding="utf-8"))))')"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Archive immutable snapshots in a verified draft release
        if: steps.prepare.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/source_snapshot.py archive \
            --out-dir _source_snapshots \
            --manifest _source_snapshot_manifest.json

      - name: Record snapshot hashes and locators
        if: steps.prepare.outputs.count != '0'
        run: |
          python3 scripts/source_snapshot.py apply \
            --manifest _source_snapshot_manifest.json \
            --locator-prefix "github-draft-release:source-snapshots-private"
          python3 scripts/validate_repository.py

      - name: Open metadata pull request
        if: steps.prepare.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/source_documents.csv; then
            echo "No snapshot metadata changes."
            exit 0
          fi
          branch="automation/source-snapshots-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/source_documents.csv
          git commit -m "Record archived source snapshots"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            existing="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
            git fetch origin "$branch"
            if ! git diff --quiet FETCH_HEAD HEAD -- data/source_documents.csv; then
              echo "Existing preservation branch differs; manual review required."
              exit 1
            fi
          else
            git push origin "HEAD:$branch"
          fi
          if test "$(gh pr list --head "$branch" --state all --json number --jq 'length')" != '0'; then
            echo "Preservation PR already exists."
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Record archived source snapshots" \
            --body "Records SHA-256 hashes and private draft-release locators for source files successfully archived by the source-preservation workflow. No procurement facts are changed."

      # GITHUB_TOKEN-created PRs do not trigger pull_request workflows. This
      # explicit dispatch supplies validation; it never bypasses required checks.
      - name: Validate generated PR branch
        if: steps.prepare.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/source-snapshots-${GITHUB_RUN_ID}"
          if gh pr list --head "$branch" --json number --jq 'length' | grep -q '^1$'; then
            gh workflow run repository-integrity.yml --ref "$branch"
          fi
