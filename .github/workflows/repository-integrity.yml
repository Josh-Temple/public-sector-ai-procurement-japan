name: Validate repository integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Verify main update came through a merged pull request
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: context.sha,
            });
            const mergedToMain = prs.some(pr => pr.merged_at && pr.base?.ref === 'main');
            if (!mergedToMain) {
              core.setFailed('Direct push to main detected. Repository policy requires changes to arrive through a merged pull request.');
            }
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate repository structure
        run: python3 scripts/validate_repository.py
      - name: Rebuild evidence projections
        run: |
          python3 scripts/build_evidence_coverage.py
          python3 scripts/build_case_evidence_summary.py
      - name: Verify generated projections are current
        run: |
          git diff --exit-code -- \
            data/evidence_coverage.csv \
            docs/EVIDENCE_COVERAGE.md \
            data/case_evidence_summary.csv \
            docs/CASE_EVIDENCE_SUMMARY.md
      - name: Validate public site
        run: python3 scripts/validate_public_site.py
      - name: Check public JavaScript syntax
        run: node --check assets/app.js
