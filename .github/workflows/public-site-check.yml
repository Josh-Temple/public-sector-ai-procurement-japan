name: Validate public site

on:
  pull_request:
    paths:
      - "index.html"
      - "insights.html"
      - "case-study.html"
      - "checklist.html"
      - "drafting.html"
      - "evaluation.html"
      - "methodology.html"
      - "robots.txt"
      - "sitemap.xml"
      - "assets/**"
      - "data/**"
      - "scripts/validate_public_site.py"
      - "tests/test_requirement_explorer.cjs"
      - "tests/test_drafting_support.cjs"
      - "tests/test_evaluation_support.cjs"
      - "tests/test_first_time_ui_contract.cjs"
      - "tests/test_effective_requirements_semantics.cjs"
      - "scripts/browser_qa_effective_requirements.py"
      - "scripts/browser_qa_negative_regression.py"
      - "scripts/browser_qa_evaluation.py"
      - ".github/workflows/pages.yml"
      - ".github/workflows/public-site-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate public site
        run: python3 scripts/validate_public_site.py
      - name: Check public JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/drafting.js
          node --check assets/evaluation.js
      - name: Test public decision support
        run: |
          node tests/test_requirement_explorer.cjs
          node tests/test_drafting_support.cjs
          node tests/test_evaluation_support.cjs
          node tests/test_first_time_ui_contract.cjs
          node tests/test_effective_requirements_semantics.cjs
      - name: Install Playwright Chromium for exact PR browser validation
        run: |
          python3 -m pip install --user "playwright==1.56.0"
          python3 -m playwright install --with-deps chromium
      - name: Verify canonical requirement DOM at four CSS widths before merge
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/effective-requirement-preview-server.log 2>&1 &
          python3 scripts/browser_qa_effective_requirements.py \
            --url http://127.0.0.1:8765/ \
            --output-dir effective-requirements-pr-qa
      - name: Verify negative Source, enum, XSS, and CSV failure cases in the PR preview
        run: |
          python3 scripts/browser_qa_negative_regression.py \
            --url http://127.0.0.1:8765/ \
            --output-dir negative-requirements-pr-qa
      - name: Preserve PR requirement browser audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effective-requirements-pr-qa
          path: |
            effective-requirements-pr-qa/
            negative-requirements-pr-qa/
          retention-days: 30
          if-no-files-found: warn
