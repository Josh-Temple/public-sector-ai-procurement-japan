name: Validate public site

on:
  pull_request:
    paths:
      - "index.html"
      - "insights.html"
      - "case-study.html"
      - "checklist.html"
      - "methodology.html"
      - "robots.txt"
      - "sitemap.xml"
      - "assets/**"
      - "data/**"
      - "scripts/validate_public_site.py"
      - ".github/workflows/pages.yml"
      - ".github/workflows/public-site-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate public site
        run: python3 scripts/validate_public_site.py
      - name: Check public JavaScript syntax
        run: node --check assets/app.js
      - name: Test requirement explorer
        run: node tests/test_requirement_explorer.cjs
